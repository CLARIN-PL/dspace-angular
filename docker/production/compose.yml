name: ${COMPOSE_PROJECT_NAME:-clarin-pl-dspace}

services:
  dspacedb:
    build:
      context: ../../../clarin-dspace/dspace/src/main/docker/dspace-postgres-pgcrypto
      args:
        POSTGRES_VERSION: 15.19
    image: clarin-pl/dspace-postgres:local
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Europe/Warsaw}
      PGDATA: /pgdata
      POSTGRES_DB: dspace
      POSTGRES_USER: dspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./manage.sh init first}
    volumes:
      - postgres_data:/pgdata
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dspace -d dspace"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  dspacesolr:
    build:
      context: ../../../clarin-dspace
      dockerfile: dspace/src/main/docker/dspace-solr/Dockerfile
      additional_contexts:
        solrconfigs: ../../../clarin-dspace/dspace/solr
      args:
        SOLR_VERSION: 8.11.4
    image: clarin-pl/dspace-solr:local
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Europe/Warsaw}
      SOLR_HEAP: ${SOLR_HEAP:-2g}
    entrypoint:
      - /bin/bash
      - -c
      - |
        init-var-solr
        precreate-core authority /opt/solr/server/solr/configsets/authority
        cp -r /opt/solr/server/solr/configsets/authority/* authority
        precreate-core oai /opt/solr/server/solr/configsets/oai
        cp -r /opt/solr/server/solr/configsets/oai/* oai
        precreate-core search /opt/solr/server/solr/configsets/search
        cp -r /opt/solr/server/solr/configsets/search/* search
        precreate-core statistics /opt/solr/server/solr/configsets/statistics
        cp -r /opt/solr/server/solr/configsets/statistics/* statistics
        exec solr -p 8983 -f -m "$${SOLR_HEAP}"
    volumes:
      - solr_data:/var/solr/data
      - solr_logs:/var/solr/logs
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:8983/solr/admin/cores?action=STATUS' >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  dspace:
    build:
      context: ../../../clarin-dspace
      dockerfile: Dockerfile
      args:
        JDK_VERSION: 17
        DSPACE_VERSION: dspace-7_x
        DSPACE_UID: ${DSPACE_UID:-1000}
        DSPACE_GID: ${DSPACE_GID:-1000}
    image: clarin-pl/dspace-backend:local
    restart: unless-stopped
    command: ["catalina.sh", "run"]
    entrypoint: ["/usr/local/bin/dspace-production-entrypoint"]
    environment:
      TZ: ${TIMEZONE:-Europe/Warsaw}
      JAVA_OPTS: ${JAVA_OPTS:--Xms1g -Xmx4g}
      DSPACE_DATABASE_HOST: dspacedb
      dspace__P__dir: /dspace
      dspace__P__name: ${DSPACE_NAME:-CLARIN-PL Repository}
      dspace__P__server__P__url: ${PUBLIC_URL:?Set PUBLIC_URL in .env}/server
      dspace__P__server__P__ssr__P__url: http://dspace:8080/server
      dspace__P__ui__P__url: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      db__P__url: jdbc:postgresql://dspacedb:5432/dspace
      db__P__username: dspace
      db__P__password: ${POSTGRES_PASSWORD:?Run ./manage.sh init first}
      solr__P__server: http://dspacesolr:8983/solr
      proxies__P__trusted__P__ipranges: 172.30.37
      jwt__P__login__P__token__P__secret: ${JWT_LOGIN_SECRET:?Run ./manage.sh init first}
      jwt__P__shortLived__P__token__P__secret: ${JWT_SHORT_LIVED_SECRET:?Run ./manage.sh init first}
      clarin__P__token__P__encryption__P__secret: ${CLARIN_TOKEN_ENCRYPTION_SECRET:?Run ./manage.sh init first}
      assetstore__P__dir: /dspace/assetstore
      assetstore__P__index__P__primary: "0"
      handle__P__prefix: ${HANDLE_PREFIX:-11321}
      handle__P__canonical__P__prefix: ${HANDLE_CANONICAL_PREFIX:-https://hdl.handle.net/}
      mail__P__server__P__disabled: ${MAIL_SERVER_DISABLED:-true}
      mail__P__server: ${MAIL_SERVER:-clarinpl.nazwa.pl}
      mail__P__server__P__port: ${MAIL_SERVER_PORT:-587}
      mail__P__server__P__username: ${MAIL_SERVER_USERNAME:-dspace@clarin-pl.eu}
      mail__P__server__P__password: ${MAIL_SERVER_PASSWORD:-}
      mail__P__from__P__address: ${MAIL_FROM_ADDRESS:-dspace@clarin-pl.eu}
      mail__P__admin: ${MAIL_ADMIN:-admin@clarin-pl.eu}
      feedback__P__recipient: ${FEEDBACK_RECIPIENT:-dspace@clarin-pl.eu}
      registration__P__notify: ${REGISTRATION_NOTIFY:-dspace@clarin-pl.eu}
      plugin__P__sequence__P__org__P__dspace__P__authenticate__P__AuthenticationMethod: ${AUTHENTICATION_METHODS:-org.dspace.authenticate.PasswordAuthentication}
      authentication__D__shibboleth__P__lazysession__P__loginurl: ${SHIBBOLETH_LOGIN_URL:-/Shibboleth.sso/Login}
      authentication__D__shibboleth__P__netid__D__header: ${SHIBBOLETH_NETID_HEADERS:-eppn,persistent-id}
      authentication__D__shibboleth__P__email__D__header: ${SHIBBOLETH_EMAIL_HEADER:-mail}
      authentication__D__shibboleth__P__firstname__D__header: ${SHIBBOLETH_FIRSTNAME_HEADER:-givenName}
      authentication__D__shibboleth__P__lastname__D__header: ${SHIBBOLETH_LASTNAME_HEADER:-sn}
      authentication__D__shibboleth__P__autoregister: ${SHIBBOLETH_AUTOREGISTER:-true}
    depends_on:
      dspacedb:
        condition: service_healthy
      dspacesolr:
        condition: service_healthy
    volumes:
      # The legacy files stay in place. The migration API registers their
      # existing internal IDs and never uploads/copies their content.
      - ${DSPACE_ASSETSTORE_PATH:?Set DSPACE_ASSETSTORE_PATH in .env}:/dspace/assetstore
      - dspace_logs:/dspace/log
      - dspace_handle:/dspace/handle-server
      - ../../../clarin-dspace/docker/production/local.cfg:/dspace/config/local.cfg:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/server/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s

  dspace-angular:
    build:
      context: ../..
      dockerfile: Dockerfile.dist
      args:
        NODE_VERSION: 22-alpine
    image: clarin-pl/dspace-angular:local
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Europe/Warsaw}
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=2048
      DSPACE_APP_CONFIG_PATH: /app/config/config.prod.local.yml
      DSPACE_UI_SSL: "false"
      DSPACE_UI_HOST: 0.0.0.0
      DSPACE_UI_PORT: 4000
      DSPACE_UI_NAMESPACE: /
      DSPACE_REST_SSL: ${REST_SSL:-false}
      DSPACE_REST_HOST: ${REST_HOST:-localhost}
      DSPACE_REST_PORT: ${REST_PORT:-4000}
      DSPACE_REST_NAMESPACE: /server
      DSPACE_REST_SSRBASEURL: http://dspace:8080/server
    depends_on:
      dspace:
        condition: service_healthy
    volumes:
      - ./config.prod.yml:/app/config/config.prod.local.yml:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/app/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  gateway:
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    depends_on:
      dspace:
        condition: service_healthy
      dspace-angular:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-4000}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/app/health | grep -q '\"status\":\"UP\"' && wget -qO- http://127.0.0.1:8080/server/api >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 5

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.37.0/24

volumes:
  postgres_data:
  solr_data:
  solr_logs:
  dspace_logs:
  dspace_handle:
