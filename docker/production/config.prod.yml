debug: false

# Polish is the primary repository language; English remains available to
# international depositors and users.
defaultLanguage: pl
languages:
  - code: pl
    label: Polski
    active: true
  - code: en
    label: English
    active: true

ui:
  ssl: false
  host: 0.0.0.0
  port: 4000
  nameSpace: /dspace
  useProxies: true
  rateLimiter:
    windowMs: 60000
    max: 500

rest:
  ssl: false
  host: localhost
  port: 4000
  nameSpace: /server
  ssrBaseUrl: http://dspace:8080/server

cache:
  control: public, max-age=604800, immutable
  serverSide:
    debug: false
    botCache:
      max: 1000
      timeToLive: 86400000
      allowStale: true

    anonymousCache:
      max: 200
      timeToLive: 10000
      allowStale: true

# No production Matomo endpoint has been provided. The browser bootstrap
# treats an empty URL as disabled instead of falling back to upstream localhost.
matomo:
  hostUrl: ''
  siteId: ''
  dimensionId: 1
