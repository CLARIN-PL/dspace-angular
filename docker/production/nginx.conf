map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 10g;
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $dspace_backend http://dspace:8080;
    set $dspace_frontend http://dspace-angular:4000;
    set $shibboleth_backend http://dspace-shibboleth:80;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Shibboleth attributes can reach DSpace only through mod_shib.
    location = /server/api/authn/shibboleth {
        proxy_set_header Shib-Identity-Provider "";
        proxy_set_header eppn "";
        proxy_set_header subject-id "";
        proxy_set_header pairwise-id "";
        proxy_set_header persistent-id "";
        proxy_set_header mail "";
        proxy_set_header givenName "";
        proxy_set_header sn "";
        proxy_set_header cn "";
        proxy_set_header entitlement "";
        proxy_set_header affiliation "";
        proxy_set_header unscoped-affiliation "";
        proxy_set_header o "";

        proxy_read_timeout 300s;
        proxy_pass $shibboleth_backend;
    }

    # SAML metadata, login, ACS and logout handlers are owned by mod_shib.
    location ^~ /shibboleth/Shibboleth.sso {
        proxy_read_timeout 300s;
        proxy_pass $shibboleth_backend;
    }

    location /server {
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_pass $dspace_backend;
    }

    location / {
        proxy_read_timeout 120s;
        proxy_pass $dspace_frontend;
    }
}
