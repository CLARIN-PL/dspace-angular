map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Accept client/protocol forwarding only from the institutional TLS proxy.
# real_ip_recursive selects the last untrusted address, so a client cannot
# influence the address forwarded to the application by prepending XFF values.
set_real_ip_from 10.45.126.252;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map "$realip_remote_addr:$http_x_forwarded_proto" $forwarded_proto {
    default $scheme;
    ~^10\.45\.126\.252: https;
}

map $forwarded_proto $forwarded_port {
    default $server_port;
    https 443;
}

# Never reflect an arbitrary Host header into redirects or upstream requests.
# Keep loopback names for health checks and local development.
map $http_host $validated_host {
    default clarin-pl.eu;
    ~^clarin-pl\.eu(?::[0-9]+)?$ $http_host;
    ~^www\.clarin-pl\.eu(?::[0-9]+)?$ $http_host;
    ~^localhost(?::[0-9]+)?$ $http_host;
    ~^127\.0\.0\.1(?::[0-9]+)?$ $http_host;
    ~^\[::1\](?::[0-9]+)?$ $http_host;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 10g;
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $dspace_backend http://dspace:8080;
    set $dspace_frontend http://dspace-angular:4000;
    set $shibboleth_backend http://dspace-shibboleth:80;

    proxy_http_version 1.1;
    proxy_set_header Host $validated_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $validated_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Port $forwarded_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Shibboleth attributes can reach DSpace only through mod_shib.
    location = /server/api/authn/shibboleth {
        proxy_set_header Shib-Identity-Provider "";
        proxy_set_header eppn "";
        proxy_set_header subject-id "";
        proxy_set_header pairwise-id "";
        proxy_set_header persistent-id "";
        proxy_set_header mail "";
        proxy_set_header givenName "";
        proxy_set_header sn "";
        proxy_set_header cn "";
        proxy_set_header entitlement "";
        proxy_set_header affiliation "";
        proxy_set_header unscoped-affiliation "";
        proxy_set_header o "";

        proxy_read_timeout 300s;
        proxy_pass $shibboleth_backend;
    }

    # The institutional TLS proxy removes the public /server prefix. Keep the
    # Shibboleth authentication endpoint behind mod_shib also in that form;
    # the generic /api compatibility route below must never handle this URL.
    location = /api/authn/shibboleth {
        proxy_set_header Shib-Identity-Provider "";
        proxy_set_header eppn "";
        proxy_set_header subject-id "";
        proxy_set_header pairwise-id "";
        proxy_set_header persistent-id "";
        proxy_set_header mail "";
        proxy_set_header givenName "";
        proxy_set_header sn "";
        proxy_set_header cn "";
        proxy_set_header entitlement "";
        proxy_set_header affiliation "";
        proxy_set_header unscoped-affiliation "";
        proxy_set_header o "";

        rewrite ^ /server/api/authn/shibboleth break;
        proxy_read_timeout 300s;
        proxy_pass $shibboleth_backend;
    }

    # SAML metadata, login, ACS and logout handlers are owned by mod_shib.
    location = /shibboleth {
        return 308 $forwarded_proto://$validated_host/shibboleth/Shibboleth.sso/Metadata;
    }

    location = /shibboleth/ {
        return 308 $forwarded_proto://$validated_host/shibboleth/Shibboleth.sso/Metadata;
    }

    location ^~ /shibboleth/Shibboleth.sso {
        proxy_read_timeout 300s;
        proxy_pass $shibboleth_backend;
    }

    # The repository UI lives under /dspace; keep the prefix for Angular SSR.
    location = /dspace {
        return 308 $forwarded_proto://$validated_host/dspace/;
    }

    # Preserve URLs published in the CLARIN Centre Registry, SIS and re3data.
    # Exact matches take precedence over the generic /dspace/ proxy below.
    location = /dspace/page/about {
        return 308 $forwarded_proto://$validated_host/dspace/static/about$is_args$args;
    }

    location = /dspace/page/deposit {
        return 308 $forwarded_proto://$validated_host/dspace/static/deposit$is_args$args;
    }

    location = /dspace/page/data {
        return 308 $forwarded_proto://$validated_host/dspace/static/deposit$is_args$args;
    }

    location = /dspace/page/item-lifecycle {
        return 308 $forwarded_proto://$validated_host/dspace/static/item-lifecycle$is_args$args;
    }

    location = /dspace/page/metadata {
        return 308 $forwarded_proto://$validated_host/dspace/static/metadata$is_args$args;
    }

    location = /dspace/page/cite {
        return 308 $forwarded_proto://$validated_host/dspace/static/cite$is_args$args;
    }

    location = /dspace/page/terms-of-service {
        return 308 $forwarded_proto://$validated_host/dspace/static/terms-of-service$is_args$args;
    }

    location = /dspace/page/trust {
        return 308 $forwarded_proto://$validated_host/dspace/static/trust$is_args$args;
    }

    location = /dspace/page/faq {
        return 308 $forwarded_proto://$validated_host/dspace/static/faq$is_args$args;
    }

    location = /dspace/page/contract {
        return 308 $forwarded_proto://$validated_host/dspace/contract$is_args$args;
    }

    location = /dspace/page/licenses {
        return 308 $forwarded_proto://$validated_host/dspace/licenses$is_args$args;
    }

    # Compatibility for the institutional TLS proxy, which removes /dspace
    # before forwarding legacy URLs registered by CLARIN services.
    location = /page/about {
        return 308 $forwarded_proto://$validated_host/dspace/static/about$is_args$args;
    }

    location = /page/deposit {
        return 308 $forwarded_proto://$validated_host/dspace/static/deposit$is_args$args;
    }

    location = /page/data {
        return 308 $forwarded_proto://$validated_host/dspace/static/deposit$is_args$args;
    }

    location = /page/item-lifecycle {
        return 308 $forwarded_proto://$validated_host/dspace/static/item-lifecycle$is_args$args;
    }

    location = /page/metadata {
        return 308 $forwarded_proto://$validated_host/dspace/static/metadata$is_args$args;
    }

    location = /page/cite {
        return 308 $forwarded_proto://$validated_host/dspace/static/cite$is_args$args;
    }

    location = /page/terms-of-service {
        return 308 $forwarded_proto://$validated_host/dspace/static/terms-of-service$is_args$args;
    }

    location = /page/trust {
        return 308 $forwarded_proto://$validated_host/dspace/static/trust$is_args$args;
    }

    location = /page/faq {
        return 308 $forwarded_proto://$validated_host/dspace/static/faq$is_args$args;
    }

    location = /page/contract {
        return 308 $forwarded_proto://$validated_host/dspace/contract$is_args$args;
    }

    location = /page/licenses {
        return 308 $forwarded_proto://$validated_host/dspace/licenses$is_args$args;
    }

    # Serve the machine-readable CMDI representation requested from a public
    # handle URL. This is evaluated before the generic Angular UI location.
    location ^~ /dspace/handle/ {
        if ($arg_format ~* ^cmdi$) {
            rewrite ^/dspace/handle/(.*)$ /cmdi/oai-metadata?metadataPrefix=cmdi&handle=$1? last;
        }
        if ($http_accept ~* "application/(x-)?cmdi(\+xml|\.xml)") {
            rewrite ^/dspace/handle/(.*)$ /cmdi/oai-metadata?metadataPrefix=cmdi&handle=$1? last;
        }
        proxy_read_timeout 120s;
        proxy_pass $dspace_frontend;
    }

    # The institutional TLS proxy strips /dspace before forwarding.
    location ^~ /handle/ {
        if ($arg_format ~* ^cmdi$) {
            rewrite ^/handle/(.*)$ /cmdi/oai-metadata?metadataPrefix=cmdi&handle=$1? last;
        }
        if ($http_accept ~* "application/(x-)?cmdi(\+xml|\.xml)") {
            rewrite ^/handle/(.*)$ /cmdi/oai-metadata?metadataPrefix=cmdi&handle=$1? last;
        }
        proxy_read_timeout 120s;
        proxy_pass $dspace_frontend/dspace$uri$is_args$args;
    }

    location ^~ /dspace/ {
        proxy_read_timeout 120s;
        proxy_pass $dspace_frontend;
    }

    # The institutional TLS proxy currently removes the /server prefix before
    # forwarding requests (public /server/api arrives here as /api). Accept
    # that form without changing the canonical URLs advertised by DSpace.
    location ^~ /api {
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_pass $dspace_backend/server$uri$is_args$args;
    }

    # The institutional TLS proxy strips /server from the two endpoints used
    # by the UI Health page. Restore the servlet context, but do not expose the
    # remaining Actuator endpoints through this alias. DSpace itself enforces
    # administrator access to /info and detailed health data.
    location = /actuator/health {
        proxy_read_timeout 30s;
        proxy_pass $dspace_backend/server$uri$is_args$args;
    }

    location = /actuator/info {
        proxy_read_timeout 30s;
        proxy_pass $dspace_backend/server$uri$is_args$args;
    }

    # The TLS proxy also removes /server from the standalone CMDI endpoint.
    # Restore the servlet context so MdSelfLink URLs return XML, not Angular.
    location ^~ /cmdi/ {
        proxy_read_timeout 300s;
        proxy_pass $dspace_backend/server$uri$is_args$args;
    }

    # The institutional TLS proxy strips /server from public OpenSearch URLs.
    # Keep the advertised Atom/RSS/service links on the DSpace backend.
    location ^~ /opensearch/ {
        proxy_read_timeout 120s;
        proxy_pass $dspace_backend/server$uri$is_args$args;
    }

    # The OAI XSLT uses WebJars from the REST web application. The
    # institutional proxy strips the public /server prefix, so restore it for
    # root-relative WebJar requests instead of letting them fall through to
    # Angular. Also accept the path as resolved relative to /oai/static/.
    location ^~ /webjars/ {
        proxy_read_timeout 120s;
        proxy_pass $dspace_backend/server$uri$is_args$args;
    }

    location ^~ /oai/webjars/ {
        rewrite ^/oai/(.*)$ /server/$1 break;
        proxy_read_timeout 120s;
        proxy_pass $dspace_backend;
    }

    # OAI-PMH has a stable public path independent of the REST servlet path.
    location = /oai {
        return 308 $forwarded_proto://$validated_host/oai/;
    }

    location ^~ /oai/ {
        rewrite ^/oai/(.*)$ /server/oai/$1 break;
        proxy_read_timeout 300s;
        proxy_pass $dspace_backend;
    }

    location /server {
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_pass $dspace_backend;
    }

    # Likewise, /shibboleth is stripped by the TLS proxy. Restore it before
    # handing the request to Apache/mod_shib so Metadata, Login and ACS share
    # the registered public handler URL.
    location ^~ /Shibboleth.sso {
        proxy_read_timeout 300s;
        proxy_pass $shibboleth_backend/shibboleth$uri$is_args$args;
    }

    # Policy and trust pages are editorial content and must not remain stale in browsers.
    location ^~ /static-files/ {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        proxy_read_timeout 120s;
        proxy_pass $dspace_frontend/dspace$uri$is_args$args;
    }

    # config.json contains the public REST origin. Never retain it across a
    # proxy or protocol change, otherwise browsers can keep calling HTTP from
    # an HTTPS page even after the server configuration has been corrected.
    location = /assets/config.json {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, max-age=0" always;
        proxy_read_timeout 120s;
        proxy_pass $dspace_frontend/dspace/assets/config.json;
    }

    location = /dspace/assets/config.json {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, max-age=0" always;
        proxy_read_timeout 120s;
        proxy_pass $dspace_frontend;
    }

    # Translation catalogs are updated independently of hashed application bundles.
    location ^~ /assets/i18n/ {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        proxy_read_timeout 120s;
        proxy_pass $dspace_frontend/dspace$uri$is_args$args;
    }

    # Theme bundles have stable URLs, so they must revalidate after a deployment.
    location ~ ^/(?:base|custom|dspace)-theme\.css$ {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        proxy_read_timeout 120s;
        proxy_pass $dspace_frontend/dspace$uri$is_args$args;
    }

    # Keep the gateway health endpoint unnamespaced for Docker health checks.
    location = /app/health {
        proxy_pass $dspace_frontend;
    }

    # The SSR server renders robots.txt outside its /dspace router. Expose it
    # inside the repository namespace as well, even when /dspace is stripped.
    location = /robots.txt {
        proxy_pass $dspace_frontend/robots.txt;
    }

    location = /dspace/robots.txt {
        proxy_pass $dspace_frontend/robots.txt;
    }

    # Conventional sitemap.xml alias for crawlers which do not discover
    # DSpace's sitemap_index.xml. Both forms cover TLS proxies which strip
    # the public /dspace prefix and local requests which preserve it.
    location = /sitemap.xml {
        proxy_pass $dspace_frontend/dspace/sitemap_index.xml;
    }

    location = /dspace/sitemap.xml {
        proxy_pass $dspace_frontend/dspace/sitemap_index.xml;
    }

    # The TLS proxy also strips /dspace. Restore the UI namespace for Angular
    # SSR and its assets. Explicit API/OAI/Shibboleth locations above take
    # precedence over this compatibility fallback.
    location / {
        proxy_read_timeout 120s;
        proxy_pass $dspace_frontend/dspace$uri$is_args$args;
    }
}
