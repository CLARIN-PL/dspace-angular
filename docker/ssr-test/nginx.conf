server {
    listen 8080;
    server_name _;
    # Use one browser origin for REST, cookies and login redirects.
    if ($host = localhost) {
        return 308 http://127.0.0.1:4400$request_uri;
    }
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $test_ui http://frontend:4000;
    set $test_rest http://dspace:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    # The published loopback port differs from nginx's internal listen port.
    proxy_set_header X-Forwarded-Port 4400;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto http;
    proxy_read_timeout 15s;

    location = / { return 302 /dspace/; }
    location /dspace/ { proxy_pass $test_ui; }
    location /app/ { proxy_pass $test_ui; }
    location /server/ { proxy_pass $test_rest; }
    location / { return 404; }
}
