<ds-themed-loading *ngIf="(dataSource.loading$ | async) && !loadingNode" class="ds-themed-loading"></ds-themed-loading>
<cdk-tree [dataSource]="dataSource" [treeControl]="treeControl" [trackBy]="trackBy">
  <!-- This is the tree node template for show more node -->
  <cdk-tree-node *cdkTreeNodeDef="let node; when: isShowMore" cdkTreeNodePadding
                 class="example-tree-node show-more-node">
    <div class="btn-group">
      <span aria-hidden="true" class="btn btn-default invisible" cdkTreeNodeToggle>
        <span class="fa fa-chevron-right"></span>
      </span>
      <div class="align-middle pt-2">
        <button *ngIf="!(dataSource.loading$ | async)" (click)="getNextPage(node)"
           class="btn btn-outline-primary btn-sm" role="button" tabindex="0">
           <i class="fas fa-angle-down"></i> {{ 'communityList.showMore' | translate }}
        </button>
        <ds-themed-loading *ngIf="node===loadingNode && dataSource.loading$ | async" class="ds-themed-loading"></ds-themed-loading>
      </div>
    </div>
    <div class="text-muted" cdkTreeNodePadding>
      <div class="d-flex">
      </div>
    </div>
  </cdk-tree-node>
  <!-- This is the tree node template for expandable nodes (coms and subcoms with children) -->
  <cdk-tree-node *cdkTreeNodeDef="let node; when: hasChild"
                 class="example-tree-node expandable-node">
    <div class="community-tree-node__inset" cdkTreeNodePadding>
      <div class="community-tree-node__layout">
        <button type="button" class="community-tree-node__toggle" cdkTreeNodeToggle
                [attr.aria-label]="(node.isExpanded ? 'communityList.collapse' : 'communityList.expand') | translate:{ name: dsoNameService.getName(node.payload) }"
                [attr.aria-expanded]="node.isExpanded"
                (click)="toggleExpanded(node)"
                data-test="expand-button">
          <i class="fa" [ngClass]="node.isExpanded ? 'fa-chevron-down' : 'fa-chevron-right'" aria-hidden="true"></i>
        </button>
        <div class="community-tree-node__content">
          <div class="community-tree-node__heading">
            <a [routerLink]="node.route" class="community-tree-node__title">{{ dsoNameService.getName(node.payload) }}</a>
            <span *ngIf="node.payload.archivedItemsCount >= 0" class="badge badge-pill badge-secondary archived-items-lead">{{node.payload.archivedItemsCount}}</span>
          </div>
          <p *ngIf="node.payload.shortDescription" class="community-tree-node__description">{{node.payload.shortDescription}}</p>
        </div>
      </div>
    </div>
    <div class="community-tree-node__loading" *ngIf="node===loadingNode && dataSource.loading$ | async">
      <ds-themed-loading class="ds-themed-loading"></ds-themed-loading>
    </div>
  </cdk-tree-node>
  <!-- This is the tree node template for leaf nodes (collections and (sub)coms without children) -->
  <cdk-tree-node *cdkTreeNodeDef="let node; when: !(hasChild && isShowMore)"
                 class="example-tree-node childless-node">
    <div class="community-tree-node__inset" cdkTreeNodePadding>
      <div class="community-tree-node__layout">
        <span class="community-tree-node__marker" aria-hidden="true"><i class="fas fa-folder"></i></span>
        <div class="community-tree-node__content">
          <div class="community-tree-node__heading">
            <a [routerLink]="node.route" class="community-tree-node__title">{{ dsoNameService.getName(node.payload) }}</a>
          </div>
          <p *ngIf="node.payload.shortDescription" class="community-tree-node__description">{{node.payload.shortDescription}}</p>
        </div>
      </div>
    </div>
  </cdk-tree-node>
</cdk-tree>
