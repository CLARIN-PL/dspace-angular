<div *ngVar="item?.allMetadataValues('local.sponsor') as sponsorMvs">
  <div *ngFor="let sponsor of sponsorMvs; let i = index; let lastItem = last">
    <div *ngVar="sponsor?.split(SPONSOR_VALUE_SEPARATOR) as sponsorMetadataValueParts">
      <div *ngIf="hasDisplayValue(sponsorMetadataValueParts?.[2])" class="sponsor-padding">
        <span id="organization-value-{{ i }}">{{ sponsorMetadataValueParts[2] }}</span>
      </div>
      <div *ngIf="hasDisplayValue(sponsorMetadataValueParts?.[1])" class="sponsor-padding">
        <span>{{ 'item.page.acknowledgement.project-code' | translate }}</span>
        <span id="project-code-value-{{ i }}" class="pl-1">{{ sponsorMetadataValueParts[1] }}</span>
      </div>
      <div *ngIf="hasDisplayValue(sponsorMetadataValueParts?.[3])" class="sponsor-padding">
        <span>{{ 'item.page.acknowledgement.project-name' | translate }}</span>
        <span id="project-name-value-{{ i }}" class="pl-1">{{ sponsorMetadataValueParts[3] }}</span>
      </div>
      <div *ngIf="!lastItem" class="pb-3"></div>
    </div>
  </div>
</div>
