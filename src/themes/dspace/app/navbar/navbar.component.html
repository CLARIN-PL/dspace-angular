<ng-container *ngIf="(isMobile$ | async) && (isAuthenticated$ | async)">
  <ds-user-menu [inExpandableNavbar]="true"></ds-user-menu>
</ng-container>
<div class="clarin-mobile-nav" role="menubar" id="main-site-navigation">
  <a class="clarin-mobile-nav__primary" routerLink="/search">{{ 'clarin.header.catalogue' | translate }}</a>
  <a class="clarin-mobile-nav__primary" routerLink="/community-list">{{ 'clarin.header.collections' | translate }}</a>
  <a class="clarin-mobile-nav__primary" routerLink="/static/deposit">{{ 'clarin.header.deposit' | translate }}</a>
  <a class="clarin-mobile-nav__primary" routerLink="/static/about">{{ 'clarin.header.policies' | translate }}</a>
  <a class="clarin-mobile-nav__primary" href="https://clarin-pl.eu/">{{ 'clarin.header.clarin_site' | translate }}</a>
  <div class="clarin-mobile-nav__system">
    <ng-container *ngFor="let section of (sections | async)">
      <ng-container *ngComponentOutlet="(sectionMap$ | async).get(section.id)?.component; injector: (sectionMap$ | async).get(section.id)?.injector;"></ng-container>
    </ng-container>
  </div>
</div>
